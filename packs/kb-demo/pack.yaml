# kb-demo 领域包：HR 知识库检索（知识库接入参考实现样例）
name: kb-demo
version: 1.0.0
description: HR 领域知识库样例包：请假/考勤制度检索工具与领域提示词（知识库接入参考实现）
core_version: ">=0.12.0"

requires_env: []
requires_modules: []

permissions:
  - "读取 HR 知识库（kb/hr，只读）"

# 本包检索工具覆盖的知识库（v0.17.25）：定位端点按「kb 名 → 声明包」校验，
# 与 allowed_roles 同口径放行（未声明 = 不可定位，fail-closed）
knowledge_bases:
  - hr

# 部门白名单（v0.17.26 PLAN 2.3）：本包仅人事部门可用——人事库（kb/hr）只对
# 人事部门账号开放（提示层不注入本包片段、工具执行入口拦截、定位端点 404）；
# 未分配部门的账号不可用。与 allowed_roles（未配置 = 不限角色）为 AND 关系。
allowed_departments:
  - hr

tools:
  - tools/search_hr_knowledge.py
prompt: prompt.md
