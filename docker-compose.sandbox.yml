# 代码执行沙箱（可选但推荐）：run_python_code 工具的执行环境
# 用法：docker compose -f docker-compose.sandbox.yml up -d
# 然后在 .env 配置 SANDBOX_URL=http://127.0.0.1:9001
#
# 锁定措施：
#   - 只绑定 127.0.0.1（仅本机 Agent 服务可达）
#   - 出网封锁（entrypoint.sh 在容器网络命名空间内用 iptables 封锁出站：
#     沙箱内代码无法访问外网或内网；入站连接不受影响）
#   - 只读根文件系统 + tmpfs 临时目录
#   - 去掉全部 Linux capabilities、禁止提权（仅保留 NET_ADMIN 供出网封锁用）
#   - CPU / 内存 / 进程数限额
#   - 服务以非 root 沙箱用户运行
#   - 共享令牌鉴权（SANDBOX_AUTH_TOKEN，Agent 与沙箱必须配置同一个值；
#     v0.17.4 起未配置令牌时 /run、/run_tool 默认拒绝执行（fail-closed），
#     生产必须配置；仅兼容存量部署可显式 SANDBOX_OPEN_MODE=true 临时放开）
#
# 注 1：不要改用 internal 网络——Docker 的 internal 网络与主机端口发布
# 不兼容（docker-proxy 无法桥接，127.0.0.1:9001 不会监听；Docker Desktop 已实测），
# 且宿主机也无法直连 internal 网络内的容器 IP。
# 注 2：最彻底的内网隔离（Linux 生产可选）：把 Agent 服务也放入 Docker，
# 与沙箱共用一个 internal 网络，去掉 ports 映射，仅保留出网封锁。
services:
  sandbox:
    build: ./sandbox
    image: poc-sandbox:latest
    container_name: poc-sandbox
    restart: unless-stopped
    ports:
      - "127.0.0.1:9001:9000"
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop: [ALL]
    cap_add:
      - NET_ADMIN   # 仅用于 entrypoint.sh 的出网封锁规则（子进程无该能力）
      - SETUID      # 供 entrypoint.sh 降权到 sandbox 用户（no-new-privileges 仍禁止提权）
      - SETGID
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64
    environment:
      SANDBOX_RUN_TIMEOUT: "15"
      SANDBOX_TOOLS_DIR: /tools
      SANDBOX_PACKS_DIR: /packs
      # Agent 侧 .env 配置同一个 SANDBOX_AUTH_TOKEN 才启用鉴权。
      # v0.17.4 起未配置令牌 = 拒绝执行（fail-closed），生产必须配置；
      # 兼容存量未鉴权部署需显式设 SANDBOX_OPEN_MODE=true
      SANDBOX_AUTH_TOKEN: "${SANDBOX_AUTH_TOKEN:-}"
      SANDBOX_OPEN_MODE: "${SANDBOX_OPEN_MODE:-false}"
    volumes:
      # 已审批的自定义工具以只读卷挂入沙箱，/run_tool 端点在隔离子进程中执行它们
      - ./custom_tools:/tools:ro
      # 领域包工具（/run_tool 带 pack 字段时从 /packs/<pack>/tools/ 取）
      - ./packs:/packs:ro
