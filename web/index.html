<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Private Agent POC</title>
<!-- 全部样式与脚本内联，无任何外部 CDN 依赖，可在断网内网环境运行 -->
<style>
  :root {
    --bg: #f3f5fa; --panel: #ffffff; --border: #e4e8f1;
    --text: #2b3040; --dim: #7d8496; --accent: #4f7cff; --accent-2: #6c5cff;
    --tool: #7c5cd6; --shadow: 0 2px 10px rgba(47, 60, 110, .07);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: linear-gradient(180deg, #eef1f9 0%, var(--bg) 240px);
    color: var(--text); font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    height: 100vh; display: flex; flex-direction: column;
  }
  header {
    padding: 12px 24px; border-bottom: 1px solid var(--border);
    background: rgba(255,255,255,.82); backdrop-filter: blur(8px);
    display: flex; align-items: center; gap: 10px; position: sticky; top: 0; z-index: 5;
  }
  header h1 { font-size: 16.5px; font-weight: 700; letter-spacing: .3px;
    display: flex; align-items: center; gap: 7px; }
  header h1 .logo { font-weight: 400; }  /* 图标保持原色，不随文字渐变 */
  header h1 .h1-text {
    background: linear-gradient(100deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text; background-clip: text; color: transparent; }
  .badge { font-size: 12px; padding: 3px 10px; border-radius: 999px;
    border: 1px solid var(--border); color: var(--dim); background: #fff; }
  .badge.live { color: #12915c; border-color: #bfe8d2; background: #effaf4; }
  .badge.mock { color: #b26a00; border-color: #f2dfb8; background: #fdf6e8; }
  .badge.online { color: #12915c; border-color: #bfe8d2; background: #effaf4; }
  .badge.online::before { content: "● "; }
  .badge.offline { color: #d64545; border-color: #f3c6c6; background: #fdf1f1; animation: pulse 1.2s infinite; }
  .badge.offline::before { content: "● "; }
  @keyframes pulse { 50% { opacity: .45; } }
  /* 技术细节徽章：非技术界面默认隐藏（保留元素，JS 照常写入，悬停记录入口仍可查） */
  #toolBadge, #obsBadge { display: none; }
  #chat { flex: 1; overflow-y: auto; padding: 28px 24px 16px; display: flex; flex-direction: column; gap: 14px; }
  .msg { max-width: 76%; padding: 11px 16px; border-radius: 16px; line-height: 1.7;
    white-space: pre-wrap; word-break: break-word; font-size: 14.5px; }
  .msg.user { align-self: flex-end; color: #fff; border-bottom-right-radius: 5px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2)); box-shadow: 0 3px 10px rgba(90, 105, 255, .28); }
  .msg.assistant { align-self: flex-start; background: var(--panel);
    border: 1px solid var(--border); border-bottom-left-radius: 5px; box-shadow: var(--shadow); }
  .msg a { color: var(--accent); text-decoration: underline; cursor: pointer; font-weight: 500; }
  .msg.user a { color: #fff; }
  .think { align-self: flex-start; max-width: 88%; margin: 0; padding: 6px 12px;
           border: 1px solid var(--border); border-radius: 12px; background: #fafbfe; opacity: .92; }
  .think summary { cursor: pointer; color: var(--dim); font-size: 12px; user-select: none; }
  .think-body { margin-top: 6px; color: var(--dim); font-size: 12px;
                line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
  .tool-chip { align-self: flex-start; font-size: 12.5px; color: var(--tool);
    background: #f6f2fd; border: 1px solid #e6dcf8; padding: 4px 12px; border-radius: 999px; }
  .tool-chip .result { color: var(--dim); }
  .approval-card { align-self: flex-start; background: #fffdf5; border: 1px solid #f0dca8;
    border-left: 4px solid #e8b64c; border-radius: 12px; padding: 13px 16px;
    font-size: 13.5px; max-width: 76%; box-shadow: var(--shadow); }
  .approval-card .title { color: #a06a00; font-weight: 600; margin-bottom: 6px; }
  .approval-card .detail { color: var(--dim); margin: 3px 0; word-break: break-all; }
  .approval-card .detail code { color: var(--text); background: #f2f4f9; padding: 1px 6px; border-radius: 5px; }
  .approval-card .btns { margin-top: 10px; display: flex; gap: 10px; align-items: center; }
  .approve-btn { background: #17945a; color: #fff; border: none; border-radius: 8px; padding: 6px 18px; cursor: pointer; font-size: 13px; }
  .reject-btn { background: #d64545; color: #fff; border: none; border-radius: 8px; padding: 6px 18px; cursor: pointer; font-size: 13px; }
  .approve-btn:hover, .reject-btn:hover { filter: brightness(1.06); }
  .approve-btn:disabled, .reject-btn:disabled { opacity: .4; cursor: not-allowed; }
  .approval-status { color: var(--dim); font-size: 12.5px; }
  #composer { display: flex; gap: 10px; padding: 14px 24px 18px; border-top: 1px solid var(--border);
    background: rgba(255,255,255,.82); backdrop-filter: blur(8px); align-items: flex-end; }
  #input { flex: 1; background: #fff; border: 1.5px solid var(--border); border-radius: 14px;
    padding: 12px 16px; color: var(--text); font-size: 14.5px; outline: none;
    resize: none; font-family: inherit; box-shadow: var(--shadow); transition: border-color .15s, box-shadow .15s; }
  #input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(79, 124, 255, .13); }
  #send { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff; border: none;
    border-radius: 14px; padding: 0 24px; font-size: 14.5px; cursor: pointer; box-shadow: 0 3px 10px rgba(90, 105, 255, .28); }
  #send:hover { filter: brightness(1.06); }
  #send:disabled { opacity: .45; cursor: not-allowed; box-shadow: none; }
  #attach { background: #fff; color: var(--dim); border: 1.5px solid var(--border); border-radius: 14px;
    padding: 0 16px; font-size: 17px; cursor: pointer; box-shadow: var(--shadow); }
  #attach:hover { color: var(--accent); border-color: var(--accent); }
  #attach:disabled { opacity: .45; cursor: not-allowed; }
  .hint { color: var(--dim); font-size: 12px; text-align: center; padding: 8px 24px; }
  .usage-note { color: #a7adbc; font-size: 11.5px; text-align: center; padding: 2px; }
  #userBadge { cursor: pointer; }
  .nav-btn { cursor: pointer; }
  .divider { align-self: center; color: var(--dim); font-size: 12px; padding: 4px 0;
    background: #eef1f8; border-radius: 999px; padding: 4px 14px; }
  /* ---- 空会话欢迎卡（非技术用户引导）---- */
  .welcome { align-self: center; max-width: 560px; width: 100%; margin: auto;
    background: var(--panel); border: 1px solid var(--border); border-radius: 20px;
    padding: 34px 30px 26px; text-align: center; box-shadow: var(--shadow); }
  .welcome .w-icon { font-size: 44px; margin-bottom: 12px; }
  .welcome h3 { font-size: 19px; font-weight: 700; margin-bottom: 8px; }
  .welcome p { color: var(--dim); font-size: 13.5px; line-height: 1.7; margin-bottom: 18px; }
  .welcome .w-grid { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  .welcome .w-try { border: 1.5px solid var(--border); background: #fafbfe; color: var(--text);
    font-size: 13px; border-radius: 999px; padding: 8px 16px; cursor: pointer; transition: all .15s; }
  .welcome .w-try:hover { border-color: var(--accent); color: var(--accent); background: #f2f6ff; }
  .welcome .w-note { color: #a7adbc; font-size: 12px; margin-top: 18px; }
  #panel { position: fixed; top: 0; right: -370px; width: 350px; height: 100vh; background: var(--panel);
    border-left: 1px solid var(--border); transition: right .2s; z-index: 10; display: flex; flex-direction: column;
    box-shadow: -6px 0 24px rgba(47, 60, 110, .10); }
  #panel.open { right: 0; }
  #panel .panel-head { display: flex; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--border); align-items: center; }
  #panel .tab { font-size: 13px; padding: 4px 12px; border-radius: 8px; border: 1px solid var(--border); color: var(--dim); cursor: pointer; }
  #panel .tab.active { color: var(--accent); border-color: var(--accent); background: #f2f6ff; }
  #panel .close { margin-left: auto; color: var(--dim); cursor: pointer; font-size: 16px; }
  #panel .panel-body { flex: 1; overflow-y: auto; padding: 10px 14px; display: flex; flex-direction: column; gap: 8px; background: #f8f9fd; }
  .sess-item { border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px; cursor: pointer;
    font-size: 13px; background: #fff; }
  .sess-item:hover { border-color: var(--accent); }
  .sess-item.current { border-color: var(--accent); background: #f2f6ff; }
  .sess-item .meta { color: var(--dim); font-size: 11.5px; margin-top: 3px; }
  .appr-item { border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px; font-size: 12.5px; background: #fff; }
  .appr-item .meta { color: var(--dim); font-size: 11.5px; margin-top: 3px; word-break: break-all; }
  .appr-item.pending { border-color: #f0dca8; background: #fffdf5; }
  .appr-item .btns { margin-top: 6px; display: flex; gap: 8px; align-items: center; }
  .appr-item .approve-btn, .appr-item .reject-btn { padding: 3px 12px; font-size: 12px; border-radius: 6px; }
  .appr-item .note { color: var(--dim); font-size: 11px; margin-top: 4px; }
  #newSessBtn { width: 100%; background: #fff; border: 1.5px dashed #cdd4e2; color: var(--dim);
    border-radius: 10px; padding: 8px; cursor: pointer; font-size: 13px; }
  #newSessBtn:hover { color: var(--accent); border-color: var(--accent); }
  /* ---- 登录框（v0.15.0 账号密码登录）---- */
  #loginMask { position: fixed; inset: 0; background: rgba(43, 48, 64, .45); backdrop-filter: blur(3px);
    display: none; align-items: center; justify-content: center; z-index: 20; }
  #loginMask.open { display: flex; }
  #loginBox { width: 360px; background: #fff; border: 1px solid var(--border); border-radius: 18px;
    padding: 26px 28px; box-shadow: 0 18px 60px rgba(47, 60, 110, .25); }
  #loginBox h2 { font-size: 17px; margin-bottom: 14px; }
  #loginBox label { display: block; font-size: 12.5px; color: var(--dim); margin: 10px 0 4px; }
  #loginBox input { width: 100%; background: #f8f9fd; border: 1.5px solid var(--border); border-radius: 10px;
    padding: 10px 12px; color: var(--text); font-size: 14px; outline: none; }
  #loginBox input:focus { border-color: var(--accent); background: #fff; }
  #loginBox .login-btn { width: 100%; margin-top: 14px; background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff; border: none; border-radius: 10px; padding: 10px; font-size: 14px; cursor: pointer; }
  #loginBox .login-btn:hover { filter: brightness(1.06); }
  #loginBox .login-btn:disabled { opacity: .45; cursor: not-allowed; }
  #loginBox .divider-line { display: flex; align-items: center; gap: 10px; color: var(--dim); font-size: 12px; margin: 16px 0 4px; }
  #loginBox .divider-line::before, #loginBox .divider-line::after { content: ""; flex: 1; border-top: 1px solid var(--border); }
  #loginErr { color: #d64545; font-size: 12.5px; margin-top: 10px; min-height: 16px; }
  #logoutBtn { width: 100%; margin-top: 8px; background: none; border: 1px solid var(--border); color: var(--dim);
    border-radius: 10px; padding: 8px; cursor: pointer; font-size: 13px; }
  #logoutBtn:hover { color: #d64545; border-color: #f3c6c6; }
</style>
</head>
<body>
<header>
  <h1><span class="logo">💠</span><span class="h1-text">智能助手</span></h1>
  <span class="badge" id="statusBadge">连接中…</span>
  <span class="badge" id="obsBadge"></span>
  <span class="badge" id="userBadge" title="当前登录身份，点击可切换或注销"></span>
  <span class="badge" id="toolBadge"></span>
  <span class="badge nav-btn" id="panelBtn" title="历史会话、待确认操作与用量">☰ 记录</span>
</header>

<div id="panel">
  <div class="panel-head">
    <span class="tab active" id="tabSessions">会话</span>
    <span class="tab" id="tabApprovals">审批记录</span>
    <span class="tab" id="tabUsage">用量</span>
    <span class="close" id="panelClose">✕</span>
  </div>
  <div class="panel-body" id="panelBody"></div>
</div>

<div id="loginMask">
  <div id="loginBox">
    <h2>🔐 欢迎使用智能助手</h2>
    <label>用户名</label>
    <input id="loginUser" autocomplete="username">
    <label>密码</label>
    <input id="loginPass" type="password" autocomplete="current-password">
    <button class="login-btn" id="loginBtn">登 录</button>
    <div class="divider-line">开发者通道</div>
    <input id="loginKey" placeholder="pak- 开头的 API Key">
    <button class="login-btn" id="keyBtn" style="background:#59606f">用 Key 进入</button>
    <div id="loginErr"></div>
    <button id="logoutBtn" style="display:none">注销当前登录</button>
  </div>
</div>

<div id="chat"></div>
<div class="hint">上传文档（📎）可让助手阅读分析；涉及删除等敏感操作时，助手会先请求你的确认</div>
<div id="composer">
  <button id="attach" title="上传文档（分析/创建工具/技能/领域包）或技能包 zip（含 SKILL.md + 子目录）">📎</button>
  <input type="file" id="fileInput" style="display:none"
         accept=".md,.markdown,.txt,.csv,.tsv,.json,.yaml,.yml,.xml,.html,.htm,.py,.js,.ts,.java,.go,.rs,.sql,.sh,.bat,.ini,.cfg,.conf,.toml,.log,.rst,.docx,.zip">
  <textarea id="input" rows="1" placeholder="有什么可以帮你？输入问题，Enter 发送"></textarea>
  <button id="send">发送</button>
</div>

<script>
const chat = document.getElementById('chat');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');
let sessionId = localStorage.getItem('poc_session') || null;  // 页面刷新/重启后恢复同一会话

// 用户标识（token 计量维度）：URL ?user=xxx 优先，否则 localStorage，缺省 anonymous
let userId = new URLSearchParams(location.search).get('user')
  || localStorage.getItem('poc_user') || 'anonymous';
const userBadge = document.getElementById('userBadge');
// ---- API 认证（AUTH_ENABLED=true 时生效）----
// Key 存 localStorage，所有请求带 Bearer；身份以服务端解析为准
let apiKey = localStorage.getItem('poc_key') || '';
let authMode = false;
function authHdr(extra) {
  const h = Object.assign({}, extra || {});
  if (apiKey) h['Authorization'] = 'Bearer ' + apiKey;
  return h;
}
// ---- 登录框（账号密码 → pat- 令牌；或直接粘贴 pak- API Key）----
const loginMask = document.getElementById('loginMask');
function showLogin(msg) {
  document.getElementById('loginErr').textContent = msg || '';
  document.getElementById('logoutBtn').style.display =
    (authMode && apiKey.startsWith('pat-')) ? '' : 'none';
  loginMask.classList.add('open');
  setTimeout(() => document.getElementById('loginUser').focus(), 50);
}
function hideLogin() { loginMask.classList.remove('open'); }
function useCredential(v) {
  apiKey = v;
  localStorage.setItem('poc_key', apiKey);
  hideLogin();
  checkHealth();
}
async function doLogin() {
  const u = document.getElementById('loginUser').value.trim();
  const p = document.getElementById('loginPass').value;
  const err = document.getElementById('loginErr');
  if (!u || !p) { err.textContent = '请输入用户名和密码'; return; }
  const btn = document.getElementById('loginBtn');
  btn.disabled = true; err.textContent = '';
  try {
    const r = await fetch('/api/auth/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: u, password: p })
    });
    if (!r.ok) { err.textContent = r.status === 401 ? '用户名或密码错误' : '登录失败（' + r.status + '）'; return; }
    const d = await r.json();
    document.getElementById('loginPass').value = '';
    useCredential(d.token);
  } catch (e) { err.textContent = '网络错误，请稍后再试'; }
  finally { btn.disabled = false; }
}
document.getElementById('loginBtn').onclick = doLogin;
document.getElementById('loginPass').onkeydown = e => { if (e.key === 'Enter') doLogin(); };
document.getElementById('keyBtn').onclick = () => {
  const v = document.getElementById('loginKey').value.trim();
  if (v) useCredential(v);
};
document.getElementById('logoutBtn').onclick = async () => {
  try { await fetch('/api/auth/logout', { method: 'POST', headers: authHdr() }); } catch (e) { /* 离线也继续本地注销 */ }
  localStorage.removeItem('poc_key'); apiKey = '';
  showLogin('已注销，请重新登录');
};
function renderUserBadge() {
  userBadge.textContent = '👤 ' + userId + (authMode ? ' 🔏' : '');
}
renderUserBadge();
userBadge.onclick = () => {
  if (authMode) { showLogin(''); return; }
  const v = prompt('输入用户标识（用于按用户统计 token 消耗）：', userId);
  if (v && v.trim()) {
    userId = v.trim().slice(0, 64);
    localStorage.setItem('poc_user', userId);
    renderUserBadge();
  }
};

function addUsageNote(usage) {
  const run = (usage && usage.run) || {};
  const sess = (usage && usage.session) || {};
  if (!run.total_tokens) return;  // 提供方未返回 usage 时不展示
  const div = document.createElement('div');
  div.className = 'usage-note';
  div.textContent = `🔢 本次 ${run.total_tokens.toLocaleString()} tokens`
    + `（输入 ${run.prompt_tokens.toLocaleString()} / 输出 ${run.completion_tokens.toLocaleString()}）`
    + (sess.total_tokens ? ` · 本会话累计 ${sess.total_tokens.toLocaleString()}` : '');
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

let serverOnline = false;

// ---- 空会话欢迎卡（非技术用户引导：示例问题点击即发送）----
const SAMPLES = ['现在几点了？', '帮我写一段项目周报', '北京今天天气怎么样？', '调研对比北京、上海、成都的天气，给出出行建议'];
function renderWelcome() {
  if (chat.children.length) return;
  const w = document.createElement('div');
  w.className = 'welcome'; w.id = 'welcome';
  const icon = document.createElement('div');
  icon.className = 'w-icon'; icon.textContent = '👋';
  const h = document.createElement('h3'); h.textContent = '你好，我是你的智能助手';
  const p = document.createElement('p');
  p.textContent = '可以问我问题、写材料、查资料、分析上传的文档。挑一个试试：';
  const grid = document.createElement('div');
  grid.className = 'w-grid';
  for (const s of SAMPLES) {
    const b = document.createElement('button');
    b.className = 'w-try'; b.textContent = s;
    b.onclick = () => { input.value = s; send(); };
    grid.appendChild(b);
  }
  const note = document.createElement('div');
  note.className = 'w-note'; note.textContent = '点右上角「☰ 记录」可查看历史会话与用量';
  w.append(icon, h, p, grid, note);
  chat.appendChild(w);
}
function removeWelcome() { const w = document.getElementById('welcome'); if (w) w.remove(); }

async function checkHealth() {
  const status = document.getElementById('statusBadge');
  try {
    const r = await fetch('/api/health', { cache: 'no-store', headers: authHdr() });
    if (!r.ok) throw new Error(r.status);
    const h = await r.json();
    // 认证模式但未持有效 Key：health 只回 {status, auth_enabled}，引导输入 Key
    if (h.auth_enabled && !h.identity) {
      authMode = true;
      serverOnline = false;
      status.textContent = '需要登录';
      status.className = 'badge offline';
      sendBtn.disabled = true;
      input.disabled = true;
      // 登录框已打开时不重复弹（否则 health 每 5s 轮询一次就抢一次焦点、
      // 清一次错误提示——用户正输密码时焦点被跳回用户名框）
      if (!apiKey) {
        if (!loginMask.classList.contains('open')) setTimeout(() => showLogin(), 300);
      }
      else if (!loginMask.classList.contains('open')) {
        localStorage.removeItem('poc_key'); apiKey = '';
        setTimeout(() => showLogin('凭据无效、已吊销或已过期，请重新登录'), 300);
      }
      else { localStorage.removeItem('poc_key'); apiKey = ''; }
      return;
    }
    if (h.auth_enabled && h.identity) {
      authMode = true;
      hideLogin();
      userId = h.identity.username + '（' + h.identity.role + '）';
      renderUserBadge();
    }
    serverOnline = true;
    // 状态灯与模型信息合并为一个徽章（方案 B）：正常=绿点+模型名/演示模式
    status.textContent = h.mode === 'mock' ? '演示模式' : '已连接 ' + h.model;
    status.className = 'badge online';
    const obs = document.getElementById('obsBadge');
    if (h.langfuse_connected) { obs.textContent = '📊 Langfuse 已连接'; obs.className = 'badge online'; }
    else if (h.langfuse_enabled) { obs.textContent = '📊 Langfuse 不可达（观测停用）'; obs.className = 'badge offline'; }
    else { obs.textContent = '📊 观测未启用'; obs.className = 'badge'; }
    document.getElementById('toolBadge').textContent = '工具: ' + (h.tools.join(', ') || '无');
    sendBtn.disabled = false;
    input.disabled = false;
  } catch (e) {
    serverOnline = false;
    status.textContent = '服务离线，每 5 秒自动重连';
    status.className = 'badge offline';
    sendBtn.disabled = true;
    input.disabled = true;
  }
}

checkHealth();
setInterval(checkHealth, 5000);

function addMsg(role, text) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  // 下载链接（/api/files/xxx）渲染为可点击元素：认证模式下 <a href> 不带
  // Bearer 头会 401，故点击时带凭据 fetch 后以 blob 触发浏览器下载。
  // 注意排除模型常用来包裹的反引号/星号，否则尾部符号混入 URL 会被服务端 400
  const parts = String(text).split(/(\/api\/files\/[^\s，。；、)」』）`*"'（(]+)/);
  if (parts.length > 1) {
    for (const p of parts) {
      if (/^\/api\/files\//.test(p)) {
        const a = document.createElement('a');
        a.href = p;
        a.textContent = '📎 ' + p.split('/').pop();
        a.title = '点击下载';
        a.onclick = (e) => { e.preventDefault(); downloadFile(p); };
        div.appendChild(a);
      } else if (p) {
        div.appendChild(document.createTextNode(p));
      }
    }
  } else {
    div.textContent = text;
  }
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

async function downloadFile(path) {
  try {
    const r = await fetch(path, { cache: 'no-store', headers: authHdr() });
    if (r.status === 401) { showLogin('登录已过期，请重新登录后再下载'); return; }
    if (!r.ok) {
      let reason = '';
      try {
        const j = await r.json();
        reason = typeof j.error === 'string' ? j.error
               : typeof j.detail === 'string' ? j.detail
               : Array.isArray(j.detail) ? j.detail.map(d => d.msg || '').join('；')
               : '';
      } catch (_) { /* 非 JSON 响应，退回只显示状态码 */ }
      addMsg('assistant', `⚠️ 下载失败（HTTP ${r.status}）${reason ? '：' + reason : ''}`);
      return;
    }
    const blob = await r.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = path.split('/').pop();
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  } catch (e) {
    addMsg('assistant', '⚠️ 下载失败：网络错误');
  }
}

function addToolChip(ev) {
  const div = document.createElement('div');
  div.className = 'tool-chip';
  div.textContent = ev.status === 'start'
    ? `⏳ 正在处理：${ev.name}…`
    : `✅ ${ev.name} 完成`;
  if (ev.result) {
    // 返回摘要默认截断预览（长结果不刷屏），点击展开/收起完整内容——
    // 「技能已更新：<完整路径>」这类末尾带关键信息的结果不再被截没
    const span = document.createElement('span');
    span.className = 'result';
    const full = ' → ' + ev.result;
    let expanded = false;
    const render = () => {
      span.textContent = expanded ? full
        : full.slice(0, 161) + (full.length > 161 ? ' …' : '');
    };
    render();
    span.title = '点击展开/收起完整返回';
    span.style.cursor = 'pointer';
    span.onclick = () => { expanded = !expanded; render(); };
    div.appendChild(span);
  }
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function addApprovalCard(ev) {
  const div = document.createElement('div');
  div.className = 'approval-card';
  const title = document.createElement('div');
  title.className = 'title';
  title.textContent = '⚠️ 危险操作审批';
  const d1 = document.createElement('div');
  d1.className = 'detail';
  d1.innerHTML = '工具：<code></code>';
  d1.querySelector('code').textContent = ev.tool;
  const d2 = document.createElement('div');
  d2.className = 'detail';
  d2.innerHTML = '参数：<code></code>';
  d2.querySelector('code').textContent = JSON.stringify(ev.args);
  const btns = document.createElement('div');
  btns.className = 'btns';
  const okBtn = document.createElement('button');
  okBtn.className = 'approve-btn';
  okBtn.textContent = '批准';
  const noBtn = document.createElement('button');
  noBtn.className = 'reject-btn';
  noBtn.textContent = '拒绝';
  const status = document.createElement('span');
  status.className = 'approval-status';
  const submit = async (approve) => {
    okBtn.disabled = noBtn.disabled = true;
    status.textContent = '提交中…';
    try {
      const r = await fetch('/api/approve', {
        method: 'POST',
        headers: authHdr({ 'Content-Type': 'application/json' }),
        body: JSON.stringify({ approval_id: ev.approval_id, approve })
      });
      const d = await r.json();
      status.textContent = d.ok
        ? (approve ? '已批准 ✓，执行中…' : '已拒绝 ✗')
        : (d.error === 'forbidden' ? '无权限决议该审批（需 approver/admin）'
           : '审批已失效（可能已超时）');
    } catch (e) {
      status.textContent = '提交失败: ' + e.message;
    }
  };
  okBtn.onclick = () => submit(true);
  noBtn.onclick = () => submit(false);
  btns.append(okBtn, noBtn, status);
  div.append(title, d1, d2, btns);
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

async function send() {
  const text = input.value.trim();
  if (!text) return;
  if (!serverOnline) {
    addMsg('assistant', '⚠️ 后端服务当前离线，正在自动重连，恢复后即可发送。');
    checkHealth();
    return;
  }
  input.value = '';
  removeWelcome();
  sendBtn.disabled = true;
  input.disabled = true;     // 流式期间禁输入：对话本质串行，防并发插队
  attachBtn.disabled = true;
  addMsg('user', text);
  let bubble = null;  // 延迟到首个 token 再创建，保证工具调用标签显示在回答之前
  const getBubble = () => bubble || (bubble = addMsg('assistant', ''));

  try {
    const resp = await fetch('/api/chat', {
      method: 'POST',
      headers: authHdr({ 'Content-Type': 'application/json' }),
      body: JSON.stringify({ message: text, session_id: sessionId, user_id: userId })
    });
    if (!resp.ok || !resp.body) throw new Error('HTTP ' + resp.status);
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    let thinkEl = null;   // 💭 思考过程折叠块（推理模型返回 reasoning_content 时出现）
    let thinkBody = null;
    const closeThink = () => {
      if (thinkEl) {
        thinkEl.open = false;
        thinkEl.querySelector('summary').textContent = '💭 思考过程（点击展开）';
      }
    };
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop();
      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const ev = JSON.parse(line.slice(6));
        if (ev.type === 'session') { sessionId = ev.session_id; localStorage.setItem('poc_session', sessionId); }
        else if (ev.type === 'reasoning') {
          if (!thinkEl) {
            thinkEl = document.createElement('details');
            thinkEl.className = 'think';
            thinkEl.open = true;   // 思考期间展开，回答开始后收起
            const s = document.createElement('summary');
            s.textContent = '💭 思考中…';
            thinkBody = document.createElement('div');
            thinkBody.className = 'think-body';
            thinkEl.appendChild(s);
            thinkEl.appendChild(thinkBody);
            chat.appendChild(thinkEl);
          }
          thinkBody.textContent += ev.content;
          chat.scrollTop = chat.scrollHeight;
        }
        else if (ev.type === 'token') { closeThink(); getBubble().textContent += ev.content; chat.scrollTop = chat.scrollHeight; }
        else if (ev.type === 'tool') { closeThink(); addToolChip(ev); }
        else if (ev.type === 'approval_required') addApprovalCard(ev);
        else if (ev.type === 'done') { closeThink(); addUsageNote(ev.usage); }
        else if (ev.type === 'error') { closeThink(); getBubble().textContent += '\n\n⚠️ ' + ev.content; }
      }
    }
  } catch (e) {
    getBubble().textContent += '\n\n⚠️ 请求失败: ' + e.message + '（已切换到离线状态，自动重连中）';
    checkHealth();  // 立刻刷新状态灯
  }
  sendBtn.disabled = !serverOnline;
  input.disabled = !serverOnline;      // 流式期间锁输入，防止并发消息插队
  attachBtn.disabled = !serverOnline;
  input.focus();
}

sendBtn.onclick = send;
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});

// ---------------------------------------------------------------- 文档上传（v0.17.7）

const attachBtn = document.getElementById('attach');
const fileInput = document.getElementById('fileInput');
attachBtn.onclick = () => fileInput.click();
fileInput.onchange = async () => {
  const f = fileInput.files[0];
  fileInput.value = '';          // 允许重复选择同一文件
  if (!f) return;
  if (!serverOnline) { addMsg('assistant', '⚠️ 后端服务当前离线，恢复后即可上传。'); return; }
  removeWelcome();
  attachBtn.disabled = true;
  attachBtn.textContent = '⏳';
  try {
    // 技能包 zip：服务端安全解包直接挂载为技能（目录型技能，含 references/ 等多文件）
    if (f.name.toLowerCase().endsWith('.zip')) { await uploadSkillPack(f); return; }
    // raw body 上传：文件名走查询参数，免 python-multipart 依赖
    const r = await fetch('/api/uploads?name=' + encodeURIComponent(f.name), {
      method: 'POST', headers: authHdr({ 'Content-Type': 'application/octet-stream' }), body: f
    });
    if (r.status === 401) { showLogin('登录已过期，请重新登录后再上传'); return; }
    const d = await r.json().catch(() => ({}));
    if (!r.ok) { addMsg('assistant', '⚠️ 上传失败：' + (d.error || ('HTTP ' + r.status))); return; }
    addMsg('user', `📎 已上传文档《${d.name}》（${d.chars.toLocaleString()} 字符）`);
    input.value = `我上传了文档《${d.name}》，请先阅读分析内容，告诉我基于它能做什么（分析/创建工具/创建技能/创建领域包均可）`;
    input.focus();
  } catch (e) {
    addMsg('assistant', '⚠️ 上传失败：网络错误');
  } finally {
    attachBtn.disabled = false;
    attachBtn.textContent = '📎';
  }
};

async function uploadSkillPack(f) {
  const doUpload = (ow) => fetch('/api/skillpacks?overwrite=' + ow, {
    method: 'POST', headers: authHdr({ 'Content-Type': 'application/zip' }), body: f
  });
  try {
    let r = await doUpload(false);
    if (r.status === 401) { showLogin('登录已过期，请重新登录后再上传'); return; }
    if (r.status === 409) {   // 技能名冲突：确认后覆盖导入
      const c = await r.json().catch(() => ({}));
      if (!confirm(c.error + '\n\n是否用压缩包内容覆盖该技能？')) {
        addMsg('assistant', '⚠️ 已取消：' + (c.error || '技能已存在'));
        return;
      }
      r = await doUpload(true);
    }
    const d = await r.json().catch(() => ({}));
    if (!r.ok) { addMsg('assistant', '⚠️ 技能包导入失败：' + (d.error || ('HTTP ' + r.status))); return; }
    addMsg('user', `📦 已导入技能包《${d.name}》（${d.files.length} 个文件）`);
    input.value = `技能包《${d.name}》已导入，请读取 skills/${d.name}/ 目录下的文件了解该技能内容，并用一两句话告诉我它的用途`;
    input.focus();
  } catch (e) {
    addMsg('assistant', '⚠️ 技能包导入失败：网络错误');
  }
}

// ---------------------------------------------------------------- 会话历史恢复与记录面板

function fmtTime(ts) {
  try { return new Date(ts * 1000).toLocaleString('zh-CN', { hour12: false }); }
  catch { return ''; }
}

function addDivider(text) {
  const div = document.createElement('div');
  div.className = 'divider';
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

// 页面加载时恢复上次会话的历史消息（记录存于服务端 SQLite，重启不丢）
async function loadHistory() {
  if (!sessionId) { renderWelcome(); return; }
  try {
    const r = await fetch(`/api/sessions/${sessionId}/history`, { cache: 'no-store', headers: authHdr() });
    if (!r.ok) { renderWelcome(); return; }
    const d = await r.json();
    const msgs = d.messages || [];
    if (!msgs.length) { renderWelcome(); return; }
    addDivider(`已恢复 ${msgs.length} 条历史消息（会话 ${sessionId}）`);
    for (const m of msgs) addMsg(m.role === 'user' ? 'user' : 'assistant', m.content);
  } catch (e) { renderWelcome(); /* 历史恢复失败不影响正常使用 */ }
}
loadHistory();

// 页面加载时检查是否有遗留的待审批（如刷新前未决议），有则在对话区提醒去面板处理
async function checkPendingApprovals() {
  try {
    const r = await fetch('/api/approvals', { cache: 'no-store', headers: authHdr() });
    if (!r.ok) return;
    const d = await r.json();
    const n = (d.approvals || []).filter(a => a.status === 'pending').length;
    if (n > 0) addDivider(`有 ${n} 条操作待你确认，点右上角「☰ 记录」处理`);
  } catch (e) { /* 提醒失败不影响正常使用 */ }
}
checkPendingApprovals();

const panel = document.getElementById('panel');
const panelBody = document.getElementById('panelBody');
let panelTab = 'sessions';

document.getElementById('panelBtn').onclick = () => {
  panel.classList.toggle('open');
  if (panel.classList.contains('open')) renderPanel();
};
document.getElementById('panelClose').onclick = () => panel.classList.remove('open');
document.getElementById('tabSessions').onclick = () => { panelTab = 'sessions'; renderPanel(); };
document.getElementById('tabApprovals').onclick = () => { panelTab = 'approvals'; renderPanel(); };
document.getElementById('tabUsage').onclick = () => { panelTab = 'usage'; renderPanel(); };

function switchSession(id) {
  sessionId = id;
  if (id) localStorage.setItem('poc_session', id);
  else localStorage.removeItem('poc_session');
  chat.innerHTML = '';
  panel.classList.remove('open');
  if (id) loadHistory();
  else renderWelcome();
  input.focus();
}

function panelHint(text) {
  const div = document.createElement('div');
  div.className = 'divider';
  div.textContent = text;
  panelBody.appendChild(div);
}

async function renderPanel() {
  const tabMap = { tabSessions: 'sessions', tabApprovals: 'approvals', tabUsage: 'usage' };
  for (const [id, name] of Object.entries(tabMap))
    document.getElementById(id).classList.toggle('active', panelTab === name);
  panelBody.innerHTML = '';
  if (panelTab === 'sessions') {
    const btn = document.createElement('button');
    btn.id = 'newSessBtn';
    btn.textContent = '＋ 新会话';
    btn.onclick = () => switchSession(null);
    panelBody.appendChild(btn);
    try {
      const r = await fetch('/api/sessions', { cache: 'no-store', headers: authHdr() });
      const d = await r.json();
      const list = d.sessions || [];
      if (!list.length) panelHint('暂无历史会话');
      for (const s of list) {
        const item = document.createElement('div');
        item.className = 'sess-item' + (s.session_id === sessionId ? ' current' : '');
        const title = document.createElement('div');
        title.textContent = (s.first_message || '（空会话）').slice(0, 30);
        const meta = document.createElement('div');
        meta.className = 'meta';
        meta.textContent = `${s.session_id} · ${s.messages} 条 · ${s.user_id} · ${fmtTime(s.last_active)}`;
        item.append(title, meta);
        item.onclick = () => switchSession(s.session_id);
        panelBody.appendChild(item);
      }
    } catch (e) {
      panelHint('会话列表加载失败: ' + e.message);
    }
  } else if (panelTab === 'approvals') {
    const emoji = { pending: '⏳ 待审批', approved: '✅ 已批准', rejected: '❌ 已拒绝', expired: '⏱ 已过期', abandoned: '⚠️ 已弃置' };
    try {
      const r = await fetch('/api/approvals', { cache: 'no-store', headers: authHdr() });
      const d = await r.json();
      const list = d.approvals || [];
      if (!list.length) panelHint('暂无审批记录');
      for (const a of list) {
        const item = document.createElement('div');
        item.className = 'appr-item' + (a.status === 'pending' ? ' pending' : '');
        const title = document.createElement('div');
        title.textContent = `${emoji[a.status] || a.status} · ${a.tool}`;
        const meta = document.createElement('div');
        meta.className = 'meta';
        const who = (a.user_id ? ` · 创建人 ${a.user_id}` : '')
          + (a.decided_by ? ` · 决议人 ${a.decided_by}` : '')
          + (a.worker_id ? ` · 发起进程 ${a.worker_id}` : '')
          + (a.executed_at ? ` · 已执行 ${fmtTime(a.executed_at)}` : '');
        meta.textContent = `${fmtTime(a.created)}${who} · ${(a.args || '').slice(0, 80)}`;
        item.append(title, meta);
        if (a.status === 'pending') {
          // 待决议入口：刷新/换会话后仍可在此批准或拒绝。
          // 注意 fail-closed 语义：若原对话已断开（等待协程消亡），
          // 决议只是关闭记录，危险操作不会补执行。
          const btns = document.createElement('div');
          btns.className = 'btns';
          const okBtn = document.createElement('button');
          okBtn.className = 'approve-btn';
          okBtn.textContent = '批准';
          const noBtn = document.createElement('button');
          noBtn.className = 'reject-btn';
          noBtn.textContent = '拒绝';
          const st = document.createElement('span');
          st.className = 'approval-status';
          const submit = async (approve) => {
            okBtn.disabled = noBtn.disabled = true;
            st.textContent = '提交中…';
            try {
              const r = await fetch('/api/approve', {
                method: 'POST',
                headers: authHdr({ 'Content-Type': 'application/json' }),
                body: JSON.stringify({ approval_id: a.aid, approve })
              });
              const d = await r.json();
              st.textContent = d.ok ? (approve ? '已批准 ✓' : '已拒绝 ✗')
                : (d.error === 'forbidden' ? '无权限决议' : '审批已失效');
              setTimeout(renderPanel, 600);
            } catch (e) {
              st.textContent = '提交失败: ' + e.message;
              okBtn.disabled = noBtn.disabled = false;
            }
          };
          okBtn.onclick = () => submit(true);
          noBtn.onclick = () => submit(false);
          btns.append(okBtn, noBtn, st);
          const note = document.createElement('div');
          note.className = 'note';
          note.textContent = '若原对话已断开，决议仅关闭记录，操作不会补执行（fail-closed）';
          item.append(btns, note);
        }
        panelBody.appendChild(item);
      }
    } catch (e) {
      panelHint('审批记录加载失败: ' + e.message);
    }
  } else {  // usage：Token 消耗聚合（/api/usage，user 角色服务端强制只看本人）
    const fmtN = n => (n || 0).toLocaleString();
    const row = (title, meta) => {
      const item = document.createElement('div');
      item.className = 'sess-item';
      const t = document.createElement('div');
      t.textContent = title;
      const m = document.createElement('div');
      m.className = 'meta';
      m.textContent = meta;
      item.append(t, m);
      panelBody.appendChild(item);
    };
    try {
      const r = await fetch('/api/usage', { cache: 'no-store', headers: authHdr() });
      const d = await r.json();
      const t = d.total || {};
      panelHint(`合计 ${t.calls || 0} 次模型调用 · 输入 ${fmtN(t.prompt_tokens)} + 输出 ${fmtN(t.completion_tokens)} = ${fmtN(t.total_tokens)} tokens`);
      if (!(d.by_user || []).length && !(d.by_session || []).length) panelHint('暂无用量记录（聊一轮即产生计量）');
      if ((d.by_user || []).length) {
        panelHint('按用户');
        for (const u of d.by_user) row(u.user_id || '(anonymous)', `${u.calls} 次调用 · ${fmtN(u.total_tokens)} tokens`);
      }
      if ((d.by_session || []).length) {
        panelHint('按会话');
        for (const s of d.by_session) row(s.session_id, `${s.user_id || 'anonymous'} · ${s.calls} 次调用 · ${fmtN(s.total_tokens)} tokens`);
      }
      const runs = (d.by_run || []).filter(x => x.worker_tokens > 0);
      if (runs.length) {
        panelHint('多 Agent 任务（worker 子图消耗单独计量）');
        for (const x of runs) row(`${x.date} ${String(x.run_id).slice(0, 8)}`,
          `${x.user_id || 'anonymous'} · 主图 ${fmtN(x.total_tokens - x.worker_tokens)} + worker ${fmtN(x.worker_tokens)} tokens`);
      }
    } catch (e) {
      panelHint('用量加载失败: ' + e.message);
    }
  }
}
