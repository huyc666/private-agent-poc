# vLLM 推理服务：加载 Qwen 27B，提供 OpenAI 兼容接口 + 工具调用解析
# 用法（项目根目录执行）：docker compose -f docker/docker-compose.yml up -d vllm
#
# 显存参考（27B 模型）：
#   FP16 约需 54GB+KV cache  →  A100/H100 80G 单卡，或 2×24G 设 --tensor-parallel-size 2
#   显存不足时可换 AWQ/FP8 量化版本模型
services:
  vllm:
    image: vllm/vllm-openai:latest
    container_name: poc-vllm
    volumes:
      # 把本地下载好的模型目录挂进去（私有化场景一般用本地权重，不走 HuggingFace）
      - ${MODEL_DIR:-../models}:/models
    # ⚠️ 模型窗口与上下文压缩对齐（SEC-6，v0.17.32）：--max-model-len 须与 .env 的
    # CONTEXT_MAX_TOKENS 同值（此默认 32768 → CONTEXT_MAX_TOKENS=32768，触发线 ≈ 19661）；
    # 换大窗口模型时两处一起改，否则长会话在压缩触发前先超模型窗口被截断。
    command: >
      --model ${MODEL_PATH:-/models/Qwen3-27B}
      --served-model-name qwen-27b
      --max-model-len 32768
      --gpu-memory-utilization 0.90
      --enable-auto-tool-choice
      --tool-call-parser hermes
      --port 8000
    ports:
      - "8000:8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
