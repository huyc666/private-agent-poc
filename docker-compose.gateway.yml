# LiteLLM 网关（可选但生产推荐）：LLM 请求统一入口
# 用法：docker compose -f docker-compose.gateway.yml up -d
# 然后在 .env 配置：
#   LLM_BASE_URL=http://127.0.0.1:4000/v1
#   LLM_API_KEY=sk-poc-gateway
#   MODEL_NAME=qwen-27b   （逻辑名不变，fallback 对 Agent 透明）
#
# 能力：多模型路由、主备 fallback（qwen 挂 → deepseek）、RPM 限流、统一审计日志。
# 正式私有化部署请编辑 gateway/litellm_config.yaml 删除 deepseek 备模型
# （或改为第二台 vLLM），并修改 master_key。
services:
  gateway:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: poc-llm-gateway
    restart: unless-stopped
    ports:
      - "127.0.0.1:4000:4000"   # 仅本机 Agent 服务可达
    volumes:
      - ./gateway/litellm_config.yaml:/app/config.yaml:ro
    environment:
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}   # 从宿主环境/.env 注入，不落盘到镜像
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:4000/health/liveliness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
